name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main, dev, homologue]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend, checks and packaging dependencies
        run: python -m pip install -r backend/requirements-dev.txt pyinstaller==6.22.3
      - name: Install the real native SAST engine separately
        run: |
          python -m venv .semgrep-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .semgrep-venv/Scripts/python.exe -m pip install semgrep==1.184.0
      - name: Lint backend and scripts
        run: python -m ruff check backend scripts --config backend/pyproject.toml
      - name: Generate application SBOM
        run: python scripts/generate_sbom.py
      - name: Backend tests including native SAST
        run: python -m pytest -q
        working-directory: backend
      - name: Check backend types
        run: python -m mypy
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend tests
        run: npm test
        working-directory: frontend
      - name: Check frontend types
        run: npx tsc --strict --noEmit
        working-directory: frontend
      - name: Build production frontend
        run: npm run build
        working-directory: frontend
      - name: Package Windows application
        run: >-
          pyinstaller --noconfirm --name VulnRadar --onedir --paths backend
          --collect-submodules app --collect-submodules uvicorn --collect-submodules sqlalchemy
          --add-data "frontend/dist;frontend/dist" --add-data "backend/alembic;backend/alembic"
          --add-data "backend/alembic.ini;backend" --add-data "rules;rules" scripts/desktop.py
      - name: Smoke packaged executable with disposable database
        run: python scripts/smoke_windows_exe.py dist/VulnRadar/VulnRadar.exe
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: VulnRadar-Windows
          path: |
            dist/VulnRadar/
            docs/review/v4/windows-exe-smoke.json
          if-no-files-found: error
          retention-days: 7
