name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install -r backend/requirements-dev.txt pyinstaller==6.22.3
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m mypy
        working-directory: backend
      - run: >-
          pyinstaller --noconfirm --name VulnRadar --onedir --paths backend
          --collect-submodules app --collect-submodules uvicorn --collect-submodules sqlalchemy
          --add-data "frontend/dist;frontend/dist" --add-data "backend/alembic;backend/alembic"
          --add-data "backend/alembic.ini;backend" --add-data "rules;rules" scripts/desktop.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VulnRadar-Windows
          path: dist/VulnRadar/
