name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r backend/requirements.txt pyinstaller
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m pytest -q
        working-directory: backend
      - run: >-
          pyinstaller --noconfirm --name VulnRadar --onedir --paths backend
          --collect-submodules app --collect-submodules uvicorn --collect-submodules sqlalchemy
          --add-data "frontend/dist;frontend/dist" --add-data "backend/alembic;backend/alembic"
          --add-data "backend/alembic.ini;backend" --add-data "rules;rules" scripts/desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: VulnRadar-Windows
          path: dist/VulnRadar/
