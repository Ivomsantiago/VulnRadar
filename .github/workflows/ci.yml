name: Validate
on:
  push:
    branches: [main, dev, homologue]
  pull_request:
    branches: [main, dev, homologue]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflows:
    name: Validate workflow definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check GitHub Actions with actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool_dir/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $tool_dir/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -color
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install the real SAST engine separately
        run: |
          python -m venv .semgrep-venv
          .semgrep-venv/bin/python -m pip install semgrep==1.184.0
      - name: Lint backend and scripts
        run: python -m ruff check backend scripts --config backend/pyproject.toml
      - name: Generate application SBOM
        run: python scripts/generate_sbom.py
      - name: Backend tests and coverage
        run: python -m pytest -q --cov=app --cov-report=json
        working-directory: backend
      - name: Check backend types
        run: python -m mypy
        working-directory: backend
      - name: Install dependency auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned Python dependencies
        run: python -m pip_audit -r backend/requirements.txt --no-deps --disable-pip
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend tests, types and production build
        run: npm test && npx tsc --strict --noEmit && npm run build
        working-directory: frontend
      - name: Check disposable schema and inventory
        run: python scripts/review_inventory.py
      - name: Check installed Python dependency consistency
        run: python -m pip check
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Install test browser dependencies
        timeout-minutes: 10
        run: |
          installed=false
          for attempt in 1 2 3; do
            if npx playwright install-deps chromium; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          if [ "$installed" != true ]; then exit 1; fi
        working-directory: frontend
      - name: Install test browser
        timeout-minutes: 5
        run: npx playwright install chromium
        working-directory: frontend
      - name: Browser tests against a disposable server
        env:
          VULNRADAR_SCREENSHOT_DIR: ../docs/screenshots/v4/after
        run: |
          server_log="$RUNNER_TEMP/vulnradar-browser.log"
          python scripts/start_test_server.py --mock-osv > "$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl --fail --silent http://127.0.0.1:8000/api/ready > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$server_log"
            exit 1
          fi
          cd frontend
          npx playwright test
      - name: Browser server diagnostics on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/vulnradar-browser.log" ]; then
            cat "$RUNNER_TEMP/vulnradar-browser.log"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            frontend/test-results/
            !frontend/test-results/auth/**
            docs/screenshots/v4/after/
            docs/review/v4/vulnradar.cdx.json
            backend/coverage.json
