name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: |
          python -m venv .semgrep-venv
          .semgrep-venv/bin/python -m pip install semgrep==1.184.0
      - run: ruff check backend
      - run: pytest -q --cov=app --cov-report=json
        working-directory: backend
      - run: mypy
        working-directory: backend
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements.txt --no-deps --disable-pip
      - run: python scripts/generate_sbom.py
      - run: npm ci
        working-directory: frontend
      - run: npm test && npx tsc --strict --noEmit && npm run build
        working-directory: frontend
      - run: python scripts/review_inventory.py
      - run: python -m pip check
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          python scripts/start_test_server.py --mock-osv > /tmp/vulnradar.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/health
          cd frontend
          VULNRADAR_SCREENSHOT_DIR=../docs/screenshots/v4/after npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-evidence
          path: |
            frontend/test-results/
            !frontend/test-results/auth/**
            docs/screenshots/
            docs/review/v4/vulnradar.cdx.json
            backend/coverage.json
